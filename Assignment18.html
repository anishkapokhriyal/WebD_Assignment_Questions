<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 650px;
            background-color: #ffffff;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
        header {
            background-color: #19287d;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        header h1 {
            margin: 0;
            font-size: 26px;
        }
        main {
            padding: 20px 60px;
        }
        h2 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 15px;
        }
        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
            font-size: 14px;
        }
        caption {
            font-size: 15px;
            margin-bottom: 5px;
        }
        th, td {
            border: 1px solid #b5bcc7;
            padding: 6px 8px;
            text-align: left;
        }
        th {
            background-color: #eaedf5;
            text-align: center;
        }
        /* Form Styling */
        fieldset {
            border: 1px solid #999999;
            padding: 15px;
            margin: 0;
        }
        legend {
            font-size: 14px;
            padding: 0 4px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 3px;
        }
        input[type="text"],
        input[type="email"] {
            width: 240px;
            padding: 3px;
            border: 1px solid #767676;
        }
        select {
            padding: 2px 4px;
            border: 1px solid #767676;
            background-color: #f0f0f0;
        }
        textarea {
            width: 95%;
            height: 60px;
            padding: 4px;
            border: 1px solid #767676;
            resize: both;
        }
        button {
            padding: 4px 10px;
            font-size: 13px;
            cursor: pointer;
            background-color: #efefef;
            border: 1px solid #767676;
            border-radius: 2px;
        }
        button:hover {
            background-color: #e2e2e2;
        }
        footer {
            background-color: #19287d;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Semantic Header -->
        <header>
            <h1>ABC College Admission 2026</h1>
        </header>

        <!-- Semantic Main Content -->
        <main>
            <section aria-labelledby="courses-heading">
                <h2 id="courses-heading">Courses and Fees</h2>
                
                <table>
                    <caption>Available Courses</caption>
                    <thead>
                        <tr>
                            <th scope="col">Course</th>
                            <th scope="col">Seats</th>
                            <th scope="col">Fees</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>B.Tech CSE</td>
                            <td>120</td>
                            <td>₹90,000</td>
                        </tr>
                        <tr>
                            <td>BCA</td>
                            <td>60</td>
                            <td>₹45,000</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <!-- Accessible & Validated Form -->
            <section aria-label="Student Application">
                <form action="#" method="post">
                    <fieldset>
                        <legend>Application Form</legend>

                        <div class="form-group">
                            <label for="student-name">Name:</label>
                            <input type="text" id="student-name" name="student_name" required minlength="2">
                        </div>

                        <div class="form-group">
                            <label for="student-email">Email:</label>
                            <input type="email" id="student-email" name="student_email" required>
                        </div>

                        <div class="form-group">
                            <label for="course-select">Course:</label>
                            <select id="course-select" name="course" required>
                                <option value="btech-cse" selected>B.Tech CSE</option>
                                <option value="bca">BCA</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="statement">Statement:</label>
                            <textarea id="statement" name="statement" required minlength="10"></textarea>
                        </div>

                        <button type="submit">Apply</button>
                    </fieldset>
                </form>
            </section>
        </main>

        <!-- Semantic Footer -->
        <footer>
            &copy; 2026 ABC College
        </footer>
    </div>

</body>
</html>
