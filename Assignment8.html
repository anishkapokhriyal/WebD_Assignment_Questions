<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlinks and Images with Attributes</title>
</head>
<body id="top">

    <p>Links demo</p>

    <!-- External Link -->
    <a href="https://www.google.com" target="_blank">External link</a><br>

    <!-- Internal Link (Jump to bottom) -->
    <a href="#bottom">Jump to bottom</a><br>

    <!-- Email Link -->
    <a href="mailto:example@email.com">Email us</a><br>

    <!-- Image Link with Attributes -->
    <a href="https://www.example.com" target="_blank">
        <img src="logo.png" alt="Logo" width="100" height="50">
    </a>

    <!-- Spacer to allow scrolling to bottom -->
    <div style="height: 500px;"></div>

    <!-- Bottom Anchor -->
    <p id="bottom">Bottom. <a href="#top">Back to top</a></p>

</body>
</html>
