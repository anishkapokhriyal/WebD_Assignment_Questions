<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 3: Block and Inline Elements</title>
    <style>
        .block-item {
            background-color: lightblue;
            margin-bottom: 5px;
        }
        .inline-item {
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <!-- Block elements take up the full width -->
    <div class="block-item">Block 1</div>
    <div class="block-item">Block 2</div>

    <!-- Inline elements only take up as much width as necessary -->
    <span class="inline-item">Inline 1</span>
    <span class="inline-item">Inline 2</span>
    <span class="inline-item">Inline 3</span>

</body>
</html>
