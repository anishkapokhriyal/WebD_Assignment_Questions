<!DOCTYPE html>
<html>
<head>
    <title>Assignment 14: Nested and Responsive Tables</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: "Times New Roman", serif;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 12px;
        }
        /* Styling for the inner nested table */
        .nested-table {
            width: 100%;
            border-collapse: collapse;
        }
        .nested-table th, .nested-table td {
            border: 1px solid black;
            padding: 5px 8px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <table>
            <tr>
                <th>Day</th>
                <th>Lab Batches</th>
                <th>Faculty</th>
                <th>Room</th>
                <th>Time</th>
            </tr>
            <tr>
                <td>Friday</td>
                <td>
                    <!-- Nested Table inside the cell -->
                    <table class="nested-table">
                        <tr>
                            <th>Batch</th>
                            <th>System</th>
                        </tr>
                        <tr>
                            <td>A1</td>
                            <td>PC 1-20</td>
                        </tr>
                        <tr>
                            <td>A2</td>
                            <td>PC 21-40</td>
                        </tr>
                    </table>
                </td>
                <td>Dr. Sharma</td>
                <td>Lab 2</td>
                <td>2-4 PM</td>
            </tr>
        </table>
    </div>

</body>
</html>
