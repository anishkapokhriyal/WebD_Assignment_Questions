<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Page</title>
</head>
<body>

    <!-- Skip Link -->
    <a href="#main-content">Skip to main content</a>

    <!-- Navigation -->
    <nav aria-label="Primary Navigation">
        <a href="#home">Home</a>
        <a href="#help">Help</a>
    </nav>

    <!-- Main Content -->
    <main id="main-content">
        <h1>Accessible Page</h1>

        <!-- Image with alt text & Button with ARIA label -->
        <p>
            <img src="learning.jpg" alt="Website decorative banner" width="200" height="25">
            <button type="button" aria-label="Close banner">X</button>
        </p>

        <!-- Form with explicit label -->
        <form>
            <label for="search-input">Search:</label>
            <input type="text" id="search-input" name="search" aria-label="Search site">
        </form>
    </main>

</body>
</html>
